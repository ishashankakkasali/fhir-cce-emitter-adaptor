spring:
  lifecycle:
    timeout-per-shutdown-phase: 45s

emitter:
  async-pool:
    core-size: 8
    max-size: 20
    queue-capacity: 2000
  target:
    retry:
      max-attempts: 5
      backoff-ms: 3000

logging:
  level:
    root: WARN
    org.openphc.cce: INFO

management:
  endpoint:
    health:
      show-details: never
